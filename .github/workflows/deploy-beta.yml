name: Deploy Beta

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  build-image:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Check out validated revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Update Docker metadata with the tag
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ vars.DOCKER_IMAGE_BETA }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
            NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}

  push-beta:
    if: github.event.workflow_run.conclusion == 'success'
    needs: build-image
    runs-on: sap-beta-runner

    steps:
      - name: Pull the latest image
        run: sudo docker pull ${{ vars.DOCKER_IMAGE_BETA }}:latest

      - name: Stop existing container
        run: sudo docker rm -f ${{ vars.CONTAINER_NAME_BETA }} || true

      - name: Run new container
        run: |
          sudo docker run \
            --name ${{ vars.CONTAINER_NAME_BETA }} \
            --restart unless-stopped \
            -e PORT="${{ vars.CONTAINER_PORT }}" \
            -e GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/gee-service-account.json \
            -e FIREBASE_PROJECT_ID="${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}" \
            -e FIREBASE_CLIENT_EMAIL="${{ secrets.FIREBASE_CLIENT_EMAIL }}" \
            -e FIREBASE_PRIVATE_KEY_BASE64="${{ secrets.FIREBASE_PRIVATE_KEY_BASE64 }}" \
            -v "${{ vars.GEE_SERVICE_ACCOUNT_PATH_BETA }}:/run/secrets/gee-service-account.json:ro" \
            -p ${{ vars.HOST_PORT_BETA }}:${{ vars.CONTAINER_PORT }} \
            -d \
            ${{ vars.DOCKER_IMAGE_BETA }}:latest

      - name: Connect to network
        run: sudo docker network connect ${{ vars.NETWORK_NAME }} ${{ vars.CONTAINER_NAME_BETA }}

      - name: Verify application health
        run: |
          for _ in $(seq 1 15); do
            if curl --fail --silent --show-error "http://127.0.0.1:${{ vars.HOST_PORT_BETA }}/" > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          sudo docker logs ${{ vars.CONTAINER_NAME_BETA }}
          exit 1

      - name: Prune unused Docker images
        run: sudo docker system prune -f
